name: Save room decision
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  save:
    if: startsWith(github.event.issue.title, '[Home decision] ') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply and persist with conflict retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            python3 apply_decision.py
            git add site/decisions.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Save room selection'
            if git push origin HEAD:master; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Mark request saved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO"
