name: Daily home search
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['crawler.py', 'sources.py', 'validate_data.py', 'config.json', 'tests/**', '.github/workflows/daily.yml']
permissions:
  contents: read
concurrency:
  group: home-finder-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect with hard time limit
        run: timeout 300 python crawler.py
      - name: Validate before saving
        run: python validate_data.py site/data.json
      - name: Save valid snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update rental snapshot'
            git push origin HEAD:master
          fi
