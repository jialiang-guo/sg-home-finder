name: Daily home search
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['site/data.json']
permissions:
  contents: read
concurrency:
  group: home-finder-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect public listings
        id: crawl
        run: python crawler.py
      - name: Save snapshot in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update rental snapshot [skip ci]'
            git push origin HEAD:master
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source health
        if: steps.crawl.outputs.degraded == 'true'
        run: echo '::warning::Source update incomplete. Dashboard retains candidates and reports missing data.'
