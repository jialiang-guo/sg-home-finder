name: Publish website
on:
  push:
    branches: [master]
    paths: ['site/**', 'validate_data.py', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily home search', 'Save room decision']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: home-finder-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Validate stored snapshot
        run: python3 validate_data.py site/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish last valid snapshot
        id: deployment
        uses: actions/deploy-pages@v4
